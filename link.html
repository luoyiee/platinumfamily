<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Scheme Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 32px 20px;
    }
    h1 { font-size: 20px; color: #111; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 16px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .card__icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .icon-youtube { background: #FF0000; }
    .icon-tiktok  { background: #000; }
    .card__info { flex: 1; min-width: 0; }
    .card__name { font-size: 15px; font-weight: 600; color: #111; margin-bottom: 3px; }
    .card__scheme {
      font-size: 12px;
      color: #888;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card__pkg { font-size: 11px; color: #bbb; margin-top: 2px; font-family: monospace; }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-youtube { background: #FF0000; }
    .btn-tiktok  { background: #000; }

    .note {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>App Scheme Test</h1>
  <p class="subtitle">点击按钮唤起对应 App，iOS / Android 通用</p>

  <div class="card">
    <div class="card__icon icon-youtube">▶️</div>
    <div class="card__info">
      <div class="card__name">YouTube</div>
      <div class="card__scheme">vnd.youtube://</div>
      <div class="card__pkg">com.google.android.youtube</div>
    </div>
    <button class="btn btn-youtube" onclick="open('vnd.youtube://')">打开</button>
  </div>

  <div class="card">
    <div class="card__icon icon-tiktok">🎵</div>
    <div class="card__info">
      <div class="card__name">TikTok</div>
      <div class="card__scheme">snssdk1233://</div>
      <div class="card__pkg">com.zhiliaoapp.musically</div>
    </div>
    <button class="btn btn-tiktok" onclick="open('snssdk1233://')">打开</button>
  </div>

  <p class="note">
    App 未安装时唤起无效<br>
    iOS 使用 UIApplication.open，Android 通过 Intent / ACTION_VIEW 触发
  </p>

  <script>
    function open(scheme) {
      window.location.href = scheme
    }
  </script>
</body>
</html>
